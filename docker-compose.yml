version: "3.8"

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib_gateway
    restart: always
    environment:
      TWS_USERID: ${IB_USER}
      TWS_PASSWORD: ${IB_PASSWORD}
      TRADING_MODE: paper
      READ_ONLY_API: "no"
      IBC_AcceptIncomingConnectionAction: "accept"
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "4004:4004"

  openclaw:
    build: .
    container_name: openclaw_agent
    restart: unless-stopped
    depends_on:
      - ib-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/logs:/app/data/logs
      - ./data/database:/app/data/database

  ollama:
    image: ollama/ollama:latest
    container_name: openclaw_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
